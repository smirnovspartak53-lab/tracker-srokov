<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📦 Трекер сроков годности</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; padding-bottom: 80px; color: #1a1a1a; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header .date { font-size: 14px; opacity: 0.9; margin-top: 4px; }
        .sync-status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; margin-left: auto; margin-right: auto; width: fit-content; }
        .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .sync-status .dot.green { background: #2ecc71; }
        .sync-status .dot.yellow { background: #f1c40f; }
        .sync-status .dot.orange { background: #e67e22; }
        .sync-status .dot.red { background: #e74c3c; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
        .stat-card { background: white; padding: 8px 4px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-card .number { font-size: 18px; font-weight: 700; }
        .stat-card .label { font-size: 9px; color: #666; margin-top: 2px; }
        .stat-card.red .number { color: #e74c3c; }
        .stat-card.orange .number { color: #e67e22; }
        .stat-card.yellow .number { color: #f39c12; }
        .stat-card.green .number { color: #27ae60; }
        .stat-card.blue .number { color: #3498db; }

        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .btn { padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); color: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-orange { background: #e67e22; color: white; }
        .btn-google { background: #4285F4; color: white; }
        .btn-full { grid-column: 1 / -1; }

        .product-list { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .product-item { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f0f0f0; gap: 10px; }
        .product-item:last-child { border-bottom: none; }
        .product-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .product-status.red { background: #e74c3c; }
        .product-status.orange { background: #e67e22; }
        .product-status.yellow { background: #f39c12; }
        .product-status.green { background: #27ae60; }

        .product-info { flex: 1; min-width: 0; }
        .product-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-details { font-size: 11px; color: #888; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
        .product-details span { display: inline-flex; align-items: center; gap: 3px; }
        .product-barcode { font-family: monospace; }
        .product-expiry { color: #666; }
        .product-days { font-size: 12px; font-weight: 600; text-align: right; flex-shrink: 0; }
        .product-days.red { color: #e74c3c; }
        .product-days.orange { color: #e67e22; }
        .product-days.yellow { color: #f39c12; }
        .product-days.green { color: #27ae60; }
        .delete-btn { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 4px 8px; }
        .delete-btn:active { color: #e74c3c; }

        .empty-state { padding: 40px 20px; text-align: center; color: #999; }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 20px 20px 0 0; padding: 24px 20px 30px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
        .modal input, .modal textarea { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: border-color 0.2s; background: #fafafa; font-family: inherit; }
        .modal input:focus, .modal textarea:focus { outline: none; border-color: #667eea; background: white; }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal .modal-actions .btn { flex: 1; }
        .btn-close-modal { background: #e0e0e0; color: #333; }

        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 2000; pointer-events: none; max-width: 90%; text-align: center; }
        .toast.show { opacity: 1; }

        .sort-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .sort-btn { padding: 5px 12px; border: 2px solid #e0e0e0; border-radius: 20px; background: white; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .sort-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .sort-btn:active { transform: scale(0.95); }

        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 16px; }
        .setup-guide { background: #fff3cd; border: 1px solid #ffc107; border-radius: 12px; padding: 16px; margin-bottom: 16px; font-size: 13px; }
        .setup-guide strong { color: #856404; }
        .setup-guide a { color: #4285F4; text-decoration: none; }
        .setup-guide .close-guide { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #856404; }

        .legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; margin-top: 8px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .legend-dot.red { background: #e74c3c; }
        .legend-dot.orange { background: #e67e22; }
        .legend-dot.yellow { background: #f39c12; }
        .legend-dot.green { background: #27ae60; }

        .weight-badge { display: inline-block; background: #f0f0f0; padding: 1px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; color: #555; }
        .weight-badge.liquid { background: #dbeafe; color: #1e40af; }
        .weight-badge.solid { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📦 Трекер сроков</h1>
        <div class="date" id="todayDate"></div>
        <div class="sync-status">
            <span class="dot" id="syncDot"></span>
            <span id="syncText">Синхронизация...</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card blue"><div class="number" id="totalCount">0</div><div class="label">Всего</div></div>
        <div class="stat-card red"><div class="number" id="expiredCount">0</div><div class="label">Просрочено</div></div>
        <div class="stat-card orange"><div class="number" id="weekCount">0</div><div class="label">2-7 дней</div></div>
        <div class="stat-card yellow"><div class="number" id="expiringCount">0</div><div class="label">0-1 день</div></div>
        <div class="stat-card green"><div class="number" id="okCount">0</div><div class="label">В порядке</div></div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" onclick="openAddModal()">➕ Добавить</button>
        <button class="btn btn-orange" onclick="filterWeek()">🟠 2-7 дней</button>
        <button class="btn btn-warning" onclick="filterExpiring()">🔔 0-1 день</button>
        <button class="btn btn-success" onclick="showAll()">📋 Все</button>
        <button class="btn btn-google" onclick="syncWithGoogle()">🔄 Синхр.</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ Очистить</button>
        <button class="btn btn-close-modal" onclick="exportData()" style="grid-column: 1 / -1;">📤 Экспорт CSV</button>
    </div>

    <div class="sort-controls">
        <button class="sort-btn active" data-sort="default" onclick="setSort('default')">📅 По сроку</button>
        <button class="sort-btn" data-sort="name" onclick="setSort('name')">📝 По названию</button>
        <button class="sort-btn" data-sort="expiry" onclick="setSort('expiry')">📅 По дате</button>
        <button class="sort-btn" data-sort="barcode" onclick="setSort('barcode')">🔢 По штрих-коду</button>
    </div>

    <div class="legend">
        <span class="legend-item"><span class="legend-dot red"></span> Просрочен</span>
        <span class="legend-item"><span class="legend-dot orange"></span> 2-7 дней</span>
        <span class="legend-item"><span class="legend-dot yellow"></span> 0-1 день</span>
        <span class="legend-item"><span class="legend-dot green"></span> > 7 дней</span>
    </div>

    <div class="product-list" id="productList">
        <div class="empty-state">
            <div class="emoji">📭</div>
            <p>Товаров пока нет</p>
            <p style="font-size: 13px; color: #bbb;">Нажмите «Добавить»</p>
        </div>
    </div>

    <div class="footer">Данные синхронизируются с Google Таблицей</div>
</div>

<!-- Модалка добавления -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h2>➕ Добавить товар</h2>
        <div class="form-group">
            <label>📝 Название товара <span style="color:red;">*</span></label>
            <textarea id="productName" placeholder="Например: Кетчуп Махеев Болгарский" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>🔢 Штрих-код</label>
            <input type="text" id="productBarcode" placeholder="Например: 4604258008505">
        </div>
        <div class="form-group">
            <label>⚖️ Вес / Объём <span style="color:#888; font-weight:400;">(необязательно)</span></label>
            <input type="text" id="productWeight" placeholder="Например: 350г, 0.4кг, 500мл, 0.5л">
            <div style="font-size: 11px; color: #888; margin-top: 4px;">
                📌 Поддерживаются: <b>г</b>, <b>кг</b>, <b>мл</b>, <b>л</b>
            </div>
        </div>
        <div class="form-group">
            <label>📅 Срок годности (ДД.ММ.ГГГГ) <span style="color:red;">*</span></label>
            <input type="text" id="productExpiry" placeholder="Например: 25.07.2026">
        </div>
        <div class="modal-actions">
            <button class="btn btn-close-modal" onclick="closeAddModal()">Отмена</button>
            <button class="btn btn-primary" onclick="addProduct()">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модалка удаления -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal">
        <h2>🗑️ Удалить товар?</h2>
        <p style="text-align: center; margin-bottom: 20px; color: #666;" id="deleteConfirmText"></p>
        <div class="modal-actions">
            <button class="btn btn-close-modal" onclick="closeDeleteModal()">Отмена</button>
            <button class="btn btn-danger" onclick="confirmDelete()">Удалить</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ============================================
    //  КОНФИГУРАЦИЯ (ИСПРАВЛЕНА)
    // ============================================
    const SHEET_URL = 'https://api.sheetbest.com/sheets/';
    const YOUR_SHEET_ID = '3887ff36-d66d-4965-ad6d-3f2b19a3d7ce';

    let products = [];
    let currentFilter = 'all';
    let currentSort = 'default';
    let deleteTargetId = null;
    let isSyncing = false;
    let isGoogleDataLoaded = false;

    // ===================== ОСНОВНЫЕ ФУНКЦИИ =====================

    function getTodayDate() {
        const now = new Date();
        return {
            date: now,
            formatted: now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
        };
    }

    function parseDateDMY(dateStr) {
        if (!dateStr) return null;
        const str = String(dateStr).trim();
        const match = str.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (match) {
            return {
                day: parseInt(match[1]),
                month: parseInt(match[2]) - 1,
                year: parseInt(match[3]),
                raw: str
            };
        }
        return null;
    }

    function getTodayDMY() {
        const now = new Date();
        return {
            day: now.getDate(),
            month: now.getMonth(),
            year: now.getFullYear()
        };
    }

    function getDaysLeftFromDate(dateStr) {
        if (!dateStr) return 999;
        const expiry = parseDateDMY(dateStr);
        if (!expiry) return 999;
        
        const today = getTodayDMY();
        const expiryDate = new Date(expiry.year, expiry.month, expiry.day);
        const todayDate = new Date(today.year, today.month, today.day);
        
        expiryDate.setHours(0, 0, 0, 0);
        todayDate.setHours(0, 0, 0, 0);
        
        return Math.floor((expiryDate.getTime() - todayDate.getTime()) / (1000 * 60 * 60 * 24));
    }

    function getDateStr(daysOffset) {
        const d = new Date();
        d.setDate(d.getDate() + daysOffset);
        return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
    }

    function formatDateForList(dateStr) {
        if (!dateStr) return 'Нет даты';
        const parsed = parseDateDMY(dateStr);
        return parsed ? parsed.raw : dateStr;
    }

    function normalizeDate(dateStr) {
        if (!dateStr) return getDateStr(7);
        const parsed = parseDateDMY(dateStr);
        return parsed ? parsed.raw : getDateStr(7);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===================== ВЕС =====================

    function parseWeight(weightStr) {
        if (!weightStr) return { value: null, unit: null, display: '' };
        let str = String(weightStr).trim().toLowerCase().replace(/\s/g, '');
        if (!str) return { value: null, unit: null, display: '' };
        
        const patterns = [
            { regex: /^([\d.]+)г$/, unit: 'г', type: 'solid' },
            { regex: /^([\d.]+)кг$/, unit: 'кг', type: 'solid' },
            { regex: /^([\d.]+)мл$/, unit: 'мл', type: 'liquid' },
            { regex: /^([\d.]+)л$/, unit: 'л', type: 'liquid' },
        ];
        
        for (const pattern of patterns) {
            const match = str.match(pattern.regex);
            if (match) {
                const value = parseFloat(match[1]);
                if (!isNaN(value) && value > 0) {
                    return { value: value, unit: pattern.unit, type: pattern.type, display: value + pattern.unit };
                }
            }
        }
        return { value: null, unit: null, type: null, display: str };
    }

    function formatWeightDisplay(weightStr) {
        if (!weightStr) return '';
        const parsed = parseWeight(weightStr);
        return parsed.display || weightStr;
    }

    function getWeightClass(weightStr) {
        if (!weightStr) return '';
        const parsed = parseWeight(weightStr);
        return parsed.type === 'liquid' ? 'liquid' : parsed.type === 'solid' ? 'solid' : '';
    }

    function getWeightIcon(weightStr) {
        if (!weightStr) return '';
        const parsed = parseWeight(weightStr);
        return parsed.type === 'liquid' ? '🧪' : parsed.type === 'solid' ? '📦' : '⚖️';
    }

    // ===================== СТАТУС =====================

    function getStatus(daysLeft) {
        if (daysLeft < 0) return { status: 'Просрочен', class: 'red' };
        if (daysLeft === 0 || daysLeft === 1) return { status: 'Истекает!', class: 'yellow' };
        if (daysLeft >= 2 && daysLeft <= 7) return { status: 'Скоро', class: 'orange' };
        return { status: 'Ок', class: 'green' };
    }

    function getStatusText(daysLeft) {
        if (daysLeft < 0) return `Просрочен (${Math.abs(daysLeft)} дн.)`;
        if (daysLeft === 0) return 'Истекает СЕГОДНЯ!';
        if (daysLeft === 1) return 'Истекает ЗАВТРА!';
        if (daysLeft >= 2 && daysLeft <= 7) return `${daysLeft} дн.`;
        return `${daysLeft} дн.`;
    }

    // ===================== ID ТАБЛИЦЫ =====================

    function getSheetId() {
        return localStorage.getItem('google_sheet_id') || YOUR_SHEET_ID;
    }

    function saveSheetId() {
        const id = document.getElementById('sheetIdInput').value.trim();
        if (id) {
            localStorage.setItem('google_sheet_id', id);
            document.getElementById('setupGuide').style.display = 'none';
            showToast('✅ ID сохранён!');
        } else {
            showToast('❌ Введите ID');
        }
    }

    // ===================== СИНХРОНИЗАЦИЯ (ИСПРАВЛЕНА — БЕЗ ДУБЛИРОВАНИЯ) =====================

    function updateSyncStatus(color, text) {
        document.getElementById('syncDot').className = 'dot ' + color;
        document.getElementById('syncText').textContent = text;
    }

    // ОЧИСТКА ТАБЛИЦЫ
    async function clearTable() {
        const sheetId = getSheetId();
        if (!sheetId) return false;
        try {
            await fetch(`${SHEET_URL}${sheetId}`, { method: 'DELETE' });
            return true;
        } catch (e) {
            return false;
        }
    }

    // ЗАПИСЬ ВСЕХ ДАННЫХ В ТАБЛИЦУ
    async function saveAllToGoogle(dataToSave) {
        const sheetId = getSheetId();
        if (!sheetId) {
            showToast('❌ ID не настроен');
            return false;
        }

        try {
            updateSyncStatus('yellow', 'Сохранение...');
            
            // Очищаем таблицу
            await clearTable();
            
            if (!dataToSave || dataToSave.length === 0) {
                updateSyncStatus('green', 'Таблица пуста');
                return true;
            }

            const response = await fetch(`${SHEET_URL}${sheetId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSave)
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            updateSyncStatus('green', 'Сохранено');
            showToast('✅ Данные сохранены');
            return true;
        } catch (error) {
            console.error('Ошибка сохранения:', error);
            updateSyncStatus('red', 'Ошибка сохранения');
            showToast('⚠️ Ошибка: ' + error.message);
            return false;
        }
    }

    // ЗАГРУЗКА ИЗ ТАБЛИЦЫ
    async function loadFromGoogle() {
        const sheetId = getSheetId();
        if (!sheetId) {
            updateSyncStatus('red', 'Не настроена');
            return;
        }

        try {
            updateSyncStatus('yellow', 'Загрузка...');
            const response = await fetch(`${SHEET_URL}${sheetId}`);
            
            if (response.status === 404) {
                updateSyncStatus('red', 'Таблица не найдена');
                loadFromLocal();
                return;
            }
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            
            if (data && Array.isArray(data) && data.length > 0) {
                products = data.map(row => ({
                    id: row.id || Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    name: row.name || 'Без названия',
                    barcode: row.barcode || '',
                    weight: row.weight || '',
                    expiry: normalizeDate(row.expiry || getDateStr(7))
                }));
                products = products.filter(p => p.name && p.name !== 'Без названия');
                saveToLocal();
                render();
                isGoogleDataLoaded = true;
                updateSyncStatus('green', `Синхронизировано (${products.length})`);
                showToast(`✅ Загружено ${products.length} товаров`);
            } else {
                products = [];
                saveToLocal();
                render();
                isGoogleDataLoaded = true;
                updateSyncStatus('green', 'Таблица пуста');
            }
        } catch (error) {
            console.error('Ошибка загрузки:', error);
            updateSyncStatus('red', 'Ошибка загрузки');
            loadFromLocal();
            showToast('⚠️ Ошибка синхронизации. Использую локальные данные.');
        }
    }

    // ПОЛНАЯ СИНХРОНИЗАЦИЯ (ЗАГРУЗКА → СОХРАНЕНИЕ → ЗАГРУЗКА)
    async function syncWithGoogle() {
        if (isSyncing) return;
        isSyncing = true;
        
        const sheetId = getSheetId();
        if (!sheetId) {
            showToast('❌ Настройте ID');
            document.getElementById('setupGuide').style.display = 'block';
            isSyncing = false;
            return;
        }

        try {
            // Загружаем данные из таблицы
            await loadFromGoogle();
            
            // Сохраняем текущие данные в таблицу (перезаписываем)
            const dataToSend = products.map(p => ({
                id: p.id || '',
                name: p.name || '',
                barcode: p.barcode || '',
                weight: p.weight || '',
                expiry: p.expiry || ''
            }));
            
            await saveAllToGoogle(dataToSend);
            
            // Снова загружаем, чтобы убедиться
            await loadFromGoogle();
            
            showToast('✅ Синхронизация завершена!');
        } catch (error) {
            console.error('Ошибка:', error);
            showToast('⚠️ Ошибка синхронизации');
        }
        isSyncing = false;
    }

    // ===================== ЛОКАЛЬНОЕ ХРАНИЛИЩЕ =====================

    function loadFromLocal() {
        const saved = localStorage.getItem('products_tracker_local');
        if (saved) {
            try { products = JSON.parse(saved); } catch(e) { products = []; }
        } else {
            products = [
                { id: '1', name: 'Молоко 3,2% 1л', barcode: '4601234567890', weight: '1л', expiry: getDateStr(2) },
                { id: '2', name: 'Кетчуп Махеев', barcode: '4604258008505', weight: '350г', expiry: getDateStr(5) },
                { id: '3', name: 'Соль', barcode: '4601234567892', weight: '', expiry: getDateStr(180) }
            ];
            saveToLocal();
        }
        render();
    }

    function saveToLocal() {
        localStorage.setItem('products_tracker_local', JSON.stringify(products));
    }

    // ===================== ОТРИСОВКА =====================

    function render() {
        const today = getTodayDate();
        document.getElementById('todayDate').textContent = '📅 ' + today.formatted;

        let filtered = [...products];
        if (currentFilter === 'expiring') {
            filtered = filtered.filter(p => {
                const days = getDaysLeftFromDate(p.expiry);
                return days >= 0 && days <= 1;
            });
        } else if (currentFilter === 'week') {
            filtered = filtered.filter(p => {
                const days = getDaysLeftFromDate(p.expiry);
                return days >= 2 && days <= 7;
            });
        }

        if (currentSort === 'name') {
            filtered.sort((a, b) => a.name.localeCompare(b.name));
        } else if (currentSort === 'expiry') {
            filtered.sort((a, b) => a.expiry.localeCompare(b.expiry));
        } else if (currentSort === 'barcode') {
            filtered.sort((a, b) => (a.barcode || '').localeCompare(b.barcode || ''));
        } else {
            filtered.sort((a, b) => getDaysLeftFromDate(a.expiry) - getDaysLeftFromDate(b.expiry));
        }

        let total = products.length, expired = 0, week = 0, expiring = 0, ok = 0;
        products.forEach(p => {
            const days = getDaysLeftFromDate(p.expiry);
            if (days < 0) expired++;
            else if (days >= 2 && days <= 7) week++;
            else if (days >= 0 && days <= 1) expiring++;
            else ok++;
        });

        document.getElementById('totalCount').textContent = total;
        document.getElementById('expiredCount').textContent = expired;
        document.getElementById('weekCount').textContent = week;
        document.getElementById('expiringCount').textContent = expiring;
        document.getElementById('okCount').textContent = ok;

        const list = document.getElementById('productList');
        if (filtered.length === 0) {
            let msg = 'Товаров пока нет';
            let emoji = '📭';
            if (currentFilter === 'expiring') {
                msg = 'Нет товаров, истекающих сегодня-завтра!';
                emoji = '🎉';
            } else if (currentFilter === 'week') {
                msg = 'Нет товаров, истекающих в ближайшую неделю!';
                emoji = '👍';
            }
            list.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">${emoji}</div>
                    <p>${msg}</p>
                    <p style="font-size: 13px; color: #bbb;">Нажмите «Добавить»</p>
                </div>
            `;
            return;
        }

        let html = '';
        filtered.forEach(p => {
            const days = getDaysLeftFromDate(p.expiry);
            const status = getStatus(days);
            const daysText = getStatusText(days);
            
            const barcodeHtml = p.barcode ? `<span class="product-barcode">🔢 ${escapeHtml(p.barcode)}</span>` : '';
            
            let weightHtml = '';
            if (p.weight && p.weight.trim()) {
                const weightClass = getWeightClass(p.weight);
                const weightIcon = getWeightIcon(p.weight);
                const weightDisplay = formatWeightDisplay(p.weight);
                weightHtml = `<span class="weight-badge ${weightClass}">${weightIcon} ${escapeHtml(weightDisplay)}</span>`;
            }
            
            const expiryDisplay = formatDateForList(p.expiry);
            
            html += `
                <div class="product-item">
                    <div class="product-status ${status.class}"></div>
                    <div class="product-info">
                        <div class="product-name">${escapeHtml(p.name)}</div>
                        <div class="product-details">
                            ${barcodeHtml}
                            ${weightHtml}
                            <span class="product-expiry">📅 ${expiryDisplay}</span>
                        </div>
                    </div>
                    <div class="product-days ${status.class}">${daysText}</div>
                    <button class="delete-btn" onclick="openDeleteModal('${p.id}')">✕</button>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    // ===================== МОДАЛКИ =====================

    function openAddModal() {
        document.getElementById('addModal').classList.add('active');
        document.getElementById('productName').value = '';
        document.getElementById('productBarcode').value = '';
        document.getElementById('productWeight').value = '';
        document.getElementById('productExpiry').value = '';
        setTimeout(() => document.getElementById('productName').focus(), 100);
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.remove('active');
    }

    function openDeleteModal(id) {
        deleteTargetId = id;
        const product = products.find(p => p.id === id);
        if (product) {
            document.getElementById('deleteConfirmText').textContent = `«${product.name}» (срок до ${formatDateForList(product.expiry)})`;
        }
        document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('active');
        deleteTargetId = null;
    }

    // ===================== ДЕЙСТВИЯ =====================

    function addProduct() {
        const name = document.getElementById('productName').value.trim();
        const barcode = document.getElementById('productBarcode').value.trim();
        const weight = document.getElementById('productWeight').value.trim();
        const expiryInput = document.getElementById('productExpiry').value.trim();

        if (!name) { showToast('❌ Введите название'); return; }
        if (!expiryInput) { showToast('❌ Введите дату'); return; }

        const parsed = parseDateDMY(expiryInput);
        if (!parsed) {
            showToast('❌ Неверный формат даты! Используйте ДД.ММ.ГГГГ');
            return;
        }

        const newProduct = {
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
            name: name,
            barcode: barcode,
            weight: weight || '',
            expiry: parsed.raw
        };

        products.push(newProduct);
        saveToLocal();
        render();
        closeAddModal();
        showToast('✅ Товар добавлен');
    }

    async function confirmDelete() {
        if (deleteTargetId) {
            const index = products.findIndex(p => p.id === deleteTargetId);
            if (index !== -1) {
                products.splice(index, 1);
                saveToLocal();
                render();
                showToast('🗑️ Товар удалён');
            }
        }
        closeDeleteModal();
    }

    function filterExpiring() {
        currentFilter = 'expiring';
        render();
        showToast('🔔 Истекают сегодня-завтра');
    }

    function filterWeek() {
        currentFilter = 'week';
        render();
        showToast('🟠 Истекают через 2-7 дней');
    }

    function showAll() {
        currentFilter = 'all';
        render();
    }

    async function clearAll() {
        if (products.length === 0) {
            showToast('📭 Список пуст');
            return;
        }
        if (confirm('Удалить все товары?')) {
            products = [];
            saveToLocal();
            render();
            showToast('🗑️ Все удалены');
        }
    }

    function setSort(type) {
        currentSort = type;
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sort === type);
        });
        render();
    }

    function exportData() {
        if (products.length === 0) {
            showToast('📭 Нет данных');
            return;
        }
        let csv = 'Название,Штрих-код,Вес/Объём,Срок годности,Дней до срока,Статус\n';
        products.forEach(p => {
            const days = getDaysLeftFromDate(p.expiry);
            const status = getStatus(days);
            const expiryDisplay = formatDateForList(p.expiry);
            csv += `"${p.name}",${p.barcode || ''},"${p.weight || ''}",${expiryDisplay},${days},${status.status}\n`;
        });
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `товары_${getDateStr(0)}.csv`;
        link.click();
        showToast('📤 Экспорт CSV');
    }

    // ===================== TOAST =====================

    let toastTimeout;
    function showToast(text) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ===================== СОБЫТИЯ =====================

    document.getElementById('addModal').addEventListener('click', function(e) {
        if (e.target === this) closeAddModal();
    });
    document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
    });

    document.getElementById('productName').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('productBarcode').focus();
        }
    });
    document.getElementById('productBarcode').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('productWeight').focus();
    });
    document.getElementById('productWeight').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('productExpiry').focus();
    });
    document.getElementById('productExpiry').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addProduct();
    });

    // ===================== АВТООБНОВЛЕНИЕ =====================

    function startDateUpdater() {
        render();
        setInterval(render, 60000);
    }

    // ===================== ИНИЦИАЛИЗАЦИЯ =====================

    async function init() {
        const sheetId = getSheetId();
        if (sheetId) {
            document.getElementById('sheetIdInput').value = sheetId;
            document.getElementById('setupGuide').style.display = 'none';
            await loadFromGoogle();
        } else {
            document.getElementById('setupGuide').style.display = 'block';
            loadFromLocal();
        }
        startDateUpdater();
        
        // Автосинхронизация каждые 60 секунд (только загрузка, без сохранения)
        setInterval(() => {
            if (getSheetId() && !isSyncing) {
                loadFromGoogle();
            }
        }, 60000);
    }

    init();
</script>
</body>
</html>
