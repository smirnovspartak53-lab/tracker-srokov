<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📦 Трекер сроков годности</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; padding-bottom: 80px; color: #1a1a1a; transition: background 0.3s, color 0.3s; }
        body.dark { background: #1a1a1a; color: #e0e0e0; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); position: relative; }
        body.dark .header { background: linear-gradient(135deg, #3a3a8a 0%, #5a2a7a 100%); }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header .date { font-size: 14px; opacity: 0.9; margin-top: 4px; }
        .header .badge-container { position: absolute; top: 12px; right: 16px; }
        .header .badge { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; font-weight: 700; min-width: 22px; text-align: center; display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .sync-status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; margin-left: auto; margin-right: auto; width: fit-content; }
        .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .sync-status .dot.green { background: #2ecc71; }
        .sync-status .dot.yellow { background: #f1c40f; }
        .sync-status .dot.orange { background: #e67e22; }
        .sync-status .dot.red { background: #e74c3c; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
        .stat-card { background: white; padding: 8px 4px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s; cursor: pointer; }
        body.dark .stat-card { background: #2a2a2a; }
        .stat-card:hover { transform: scale(1.02); }
        .stat-card .number { font-size: 18px; font-weight: 700; }
        .stat-card .label { font-size: 9px; color: #666; margin-top: 2px; }
        body.dark .stat-card .label { color: #aaa; }
        .stat-card.red .number { color: #e74c3c; }
        .stat-card.orange .number { color: #e67e22; }
        .stat-card.yellow .number { color: #f39c12; }
        .stat-card.green .number { color: #27ae60; }
        .stat-card.blue .number { color: #3498db; }

        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .btn { padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); color: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 4px; position: relative; }
        body.dark .btn { background: #2a2a2a; color: #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-orange { background: #e67e22; color: white; }
        .btn-google { background: #4285F4; color: white; }
        .btn-full { grid-column: 1 / -1; }
        .btn-purple { background: #8e44ad; color: white; }
        .btn-remove-dept { background: #e67e22; color: white; }
        .btn-calculator { background: #e74c3c; color: white; }
        .btn-rebuild { background: #2c3e50; color: white; }
        .btn-export { background: #27ae60; color: white; }
        .btn-theme { background: #6c757d; color: white; }
        .btn-pdf { background: #dc3545; color: white; }
        .btn-stats { background: #17a2b8; color: white; }
        .btn-template { background: #fd7e14; color: white; }
        .btn-template-add { background: #28a745; color: white; }
        .btn-notify { background: #e74c3c; color: white; }
        .btn-notify .badge { position: absolute; top: -6px; right: -6px; background: #ff6b6b; color: white; border-radius: 50%; padding: 2px 8px; font-size: 10px; font-weight: 700; }
        .btn-edit { background: #3498db; color: white; }

        .calculator { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); display: none; }
        body.dark .calculator { background: #2a2a2a; }
        .calculator.active { display: block; }
        .calculator h3 { font-size: 18px; margin-bottom: 16px; text-align: center; color: #333; }
        body.dark .calculator h3 { color: #e0e0e0; }
        .calculator .form-group { margin-bottom: 14px; }
        .calculator label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
        body.dark .calculator label { color: #e0e0e0; }
        .calculator input, .calculator select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.2s; background: #fafafa; font-family: inherit; }
        body.dark .calculator input, body.dark .calculator select { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
        .calculator input:focus, .calculator select:focus { outline: none; border-color: #667eea; background: white; }
        body.dark .calculator input:focus, body.dark .calculator select:focus { background: #2a2a2a; border-color: #667eea; }
        .calculator .result { background: #f8f9fa; border-radius: 12px; padding: 16px; margin-top: 16px; text-align: center; }
        body.dark .calculator .result { background: #1a1a1a; }
        .calculator .result .date { font-size: 24px; font-weight: 700; color: #667eea; }
        .calculator .result .days { font-size: 18px; font-weight: 600; margin-top: 8px; }
        .calculator .result .days.green { color: #27ae60; }
        .calculator .result .days.orange { color: #f39c12; }
        .calculator .result .days.red { color: #e74c3c; }
        .calculator .result .info { font-size: 13px; color: #888; margin-top: 8px; }

        .product-list { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
