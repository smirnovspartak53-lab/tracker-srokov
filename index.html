<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>📦 Трекер сроков годности</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ===== ВЕСЬ CSS ОСТАЕТСЯ БЕЗ ИЗМЕНЕНИЙ ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 16px; padding-bottom: 80px; color: #1a1a1a; transition: background 0.3s, color 0.3s; }
        body.dark { background: #1a1a1a; color: #e0e0e0; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 16px; margin-bottom: 16px; text-align: center; box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); position: relative; }
        body.dark .header { background: linear-gradient(135deg, #3a3a8a 0%, #5a2a7a 100%); }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header .date { font-size: 14px; opacity: 0.9; margin-top: 4px; }
        .header .badge-container { position: absolute; top: 12px; right: 16px; }
        .header .badge { background: #e74c3c; color: white; border-radius: 50%; padding: 2px 8px; font-size: 12px; font-weight: 700; min-width: 22px; text-align: center; display: inline-block; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .sync-status { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 13px; background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; margin-left: auto; margin-right: auto; width: fit-content; }
        .sync-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .sync-status .dot.green { background: #2ecc71; }
        .sync-status .dot.yellow { background: #f1c40f; }
        .sync-status .dot.orange { background: #e67e22; }
        .sync-status .dot.red { background: #e74c3c; }

        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
        .stat-card { background: white; padding: 8px 4px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: all 0.2s; cursor: pointer; }
        body.dark .stat-card { background: #2a2a2a; }
        .stat-card:hover { transform: scale(1.02); }
        .stat-card .number { font-size: 18px; font-weight: 700; }
        .stat-card .label { font-size: 9px; color: #666; margin-top: 2px; }
        body.dark .stat-card .label { color: #aaa; }
        .stat-card.red .number { color: #e74c3c; }
        .stat-card.orange .number { color: #e67e22; }
        .stat-card.yellow .number { color: #f39c12; }
        .stat-card.green .number { color: #27ae60; }
        .stat-card.blue .number { color: #3498db; }

        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
        .btn { padding: 12px; border: none; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); color: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 4px; position: relative; }
        body.dark .btn { background: #2a2a2a; color: #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-orange { background: #e67e22; color: white; }
        .btn-google { background: #4285F4; color: white; }
        .btn-full { grid-column: 1 / -1; }
        .btn-purple { background: #8e44ad; color: white; }
        .btn-remove-dept { background: #e67e22; color: white; }
        .btn-calculator { background: #e74c3c; color: white; }
        .btn-rebuild { background: #2c3e50; color: white; }
        .btn-export { background: #27ae60; color: white; }
        .btn-theme { background: #6c757d; color: white; }
        .btn-pdf { background: #dc3545; color: white; }
        .btn-stats { background: #17a2b8; color: white; }
        .btn-template { background: #fd7e14; color: white; }
        .btn-template-add { background: #28a745; color: white; }
        .btn-notify { background: #e74c3c; color: white; }
        .btn-notify .badge { position: absolute; top: -6px; right: -6px; background: #ff6b6b; color: white; border-radius: 50%; padding: 2px 8px; font-size: 10px; font-weight: 700; }
        .btn-edit { background: #3498db; color: white; }

        .calculator { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); display: none; }
        body.dark .calculator { background: #2a2a2a; }
        .calculator.active { display: block; }
        .calculator h3 { font-size: 18px; margin-bottom: 16px; text-align: center; color: #333; }
        body.dark .calculator h3 { color: #e0e0e0; }
        .calculator .form-group { margin-bottom: 14px; }
        .calculator label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
        body.dark .calculator label { color: #e0e0e0; }
        .calculator input, .calculator select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; transition: border-color 0.2s; background: #fafafa; font-family: inherit; }
        body.dark .calculator input, body.dark .calculator select { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
        .calculator input:focus, .calculator select:focus { outline: none; border-color: #667eea; background: white; }
        body.dark .calculator input:focus, body.dark .calculator select:focus { background: #2a2a2a; border-color: #667eea; }
        .calculator .result { background: #f8f9fa; border-radius: 12px; padding: 16px; margin-top: 16px; text-align: center; }
        body.dark .calculator .result { background: #1a1a1a; }
        .calculator .result .date { font-size: 24px; font-weight: 700; color: #667eea; }
        .calculator .result .days { font-size: 18px; font-weight: 600; margin-top: 8px; }
        .calculator .result .days.green { color: #27ae60; }
        .calculator .result .days.orange { color: #f39c12; }
        .calculator .result .days.red { color: #e74c3c; }

        .product-list { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        body.dark .product-list { background: #2a2a2a; }
        .product-item { display: flex; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f0f0f0; gap: 10px; cursor: pointer; transition: background 0.2s; }
        body.dark .product-item { border-bottom: 1px solid #3a3a3a; }
        .product-item:hover { background: #f8f9fa; }
        body.dark .product-item:hover { background: #333; }
        .product-item:last-child { border-bottom: none; }
        .product-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .product-status.red { background: #e74c3c; }
        .product-status.orange { background: #e67e22; }
        .product-status.yellow { background: #f39c12; }
        .product-status.green { background: #27ae60; }

        .product-info { flex: 1; min-width: 0; }
        .product-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-details { font-size: 11px; color: #888; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
        body.dark .product-details { color: #aaa; }
        .product-details span { display: inline-flex; align-items: center; gap: 3px; }
        .product-barcode { font-family: monospace; font-size: 11px; }
        .product-expiry { color: #666; }
        body.dark .product-expiry { color: #aaa; }
        .product-days { font-size: 12px; font-weight: 600; text-align: right; flex-shrink: 0; }
        .product-days.red { color: #e74c3c; }
        .product-days.orange { color: #e67e22; }
        .product-days.yellow { color: #f39c12; }
        .product-days.green { color: #27ae60; }
        .product-actions { display: flex; gap: 4px; flex-shrink: 0; }
        .product-actions .btn-icon { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: all 0.2s; }
        .product-actions .btn-icon:hover { background: #f0f0f0; }
        body.dark .product-actions .btn-icon:hover { background: #3a3a3a; }
        .product-actions .btn-icon.remove-dept { color: #e67e22; }
        .product-actions .btn-icon.remove-dept:hover { background: #fde8d0; }
        .product-actions .btn-icon.delete { color: #ccc; }
        .product-actions .btn-icon.delete:hover { background: #fee; color: #e74c3c; }

        .empty-state { padding: 40px 20px; text-align: center; color: #999; }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 20px 20px 0 0; padding: 24px 20px 30px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; }
        body.dark .modal { background: #2a2a2a; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        body.dark .modal h2 { color: #e0e0e0; }
        .modal .form-group { margin-bottom: 16px; }
        .modal label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #333; }
        body.dark .modal label { color: #e0e0e0; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: border-color 0.2s; background: #fafafa; font-family: inherit; }
        body.dark .modal input, body.dark .modal textarea, body.dark .modal select { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
        .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #667eea; background: white; }
        body.dark .modal input:focus, body.dark .modal textarea:focus, body.dark .modal select:focus { background: #2a2a2a; border-color: #667eea; }
        .modal textarea { resize: vertical; min-height: 60px; }
        .modal .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal .modal-actions .btn { flex: 1; }
        .btn-close-modal { background: #e0e0e0; color: #333; }
        body.dark .btn-close-modal { background: #444; color: #e0e0e0; }

        .search-box { width: 100%; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; margin-bottom: 10px; background: #fafafa; transition: border-color 0.2s; }
        body.dark .search-box { background: #1a1a1a; border-color: #444; color: #e0e0e0; }
        .search-box:focus { outline: none; border-color: #667eea; background: white; }
        body.dark .search-box:focus { background: #2a2a2a; border-color: #667eea; }

        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 2000; pointer-events: none; max-width: 90%; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.warning { background: #e67e22; }
        .toast.danger { background: #e74c3c; }
        .toast.success { background: #27ae60; }

        .sort-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .sort-btn { padding: 5px 12px; border: 2px solid #e0e0e0; border-radius: 20px; background: white; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        body.dark .sort-btn { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
        .sort-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .sort-btn:active { transform: scale(0.95); }

        .department-controls { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .dept-btn { padding: 5px 12px; border: 2px solid #8e44ad; border-radius: 20px; background: white; color: #8e44ad; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        body.dark .dept-btn { background: #2a2a2a; border-color: #8e44ad; color: #8e44ad; }
        .dept-btn.active { background: #8e44ad; color: white; }
        .dept-btn:active { transform: scale(0.95); }
        .dept-btn-all { border-color: #666; color: #666; }
        .dept-btn-all.active { background: #666; color: white; }
        .dept-btn-clear { border-color: #e67e22; color: #e67e22; }
        .dept-btn-clear:hover { background: #e67e22; color: white; }

        .search-controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .search-input { flex: 1; min-width: 150px; padding: 8px 14px; border: 2px solid #e0e0e0; border-radius: 20px; font-size: 13px; background: white; transition: border-color 0.2s; }
        body.dark .search-input { background: #2a2a2a; border-color: #444; color: #e0e0e0; }
        .search-input:focus { outline: none; border-color: #667eea; }
        .search-clear { padding: 6px 12px; border: none; border-radius: 20px; background: #e0e0e0; color: #333; font-size: 12px; cursor: pointer; }
        body.dark .search-clear { background: #444; color: #e0e0e0; }
        .search-clear:hover { background: #ccc; }

        .footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 16px; }
        .legend { display: flex; gap: 12px; justify-content: center; font-size: 11px; margin-top: 8px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .legend-dot.red { background: #e74c3c; }
        .legend-dot.orange { background: #e67e22; }
        .legend-dot.yellow { background: #f39c12; }
        .legend-dot.green { background: #27ae60; }

        .weight-badge { display: inline-block; background: #f0f0f0; padding: 1px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; color: #555; }
        body.dark .weight-badge { background: #3a3a3a; color: #ccc; }
        .weight-badge.liquid { background: #dbeafe; color: #1e40af; }
        body.dark .weight-badge.liquid { background: #1a2a4a; color: #7ab7ef; }
        .weight-badge.solid { background: #fef3c7; color: #92400e; }
        body.dark .weight-badge.solid { background: #3a2a0a; color: #f0c87a; }
        .department-badge { display: inline-block; background: #e8d5f5; color: #6c3483; padding: 1px 8px; border-radius: 10px; font-size: 10px; font-weight: 500; }
        body.dark .department-badge { background: #2a1a3a; color: #b07ad0; }

        .product-select-item { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f0f0f0; gap: 10px; cursor: pointer; transition: background 0.2s; }
        body.dark .product-select-item { border-bottom: 1px solid #3a3a3a; }
        .product-select-item:hover { background: #f8f0ff; }
        body.dark .product-select-item:hover { background: #2a1a3a; }
        .product-select-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #8e44ad; flex-shrink: 0; }
        .product-select-item .product-info { flex: 1; }
        .product-select-item .product-name { font-size: 13px; }
        .product-select-item .product-details { font-size: 10px; }
        .product-select-item.selected { background: #f0e6ff; }
        body.dark .product-select-item.selected { background: #2a1a3a; }
        .select-actions { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .select-actions .btn { padding: 8px 16px; font-size: 12px; }
        .selected-count { font-size: 13px; color: #666; text-align: center; margin-top: 8px; }
        body.dark .selected-count { color: #aaa; }

        .export-options { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
        .export-options label { display: flex; align-items: center; gap: 10px; font-weight: 400; cursor: pointer; padding: 8px 12px; border-radius: 8px; transition: background 0.2s; }
        body.dark .export-options label { color: #e0e0e0; }
        .export-options label:hover { background: #f0f0f0; }
        body.dark .export-options label:hover { background: #3a3a3a; }
        .export-options input[type="radio"] { width: 18px; height: 18px; accent-color: #667eea; cursor: pointer; }
        .export-products-list { max-height: 200px; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 8px; padding: 8px; }
        body.dark .export-products-list { border-color: #444; }
        .export-products-list .product-check-item { display: flex; align-items: center; padding: 6px 8px; gap: 8px; cursor: pointer; border-radius: 4px; }
        body.dark .export-products-list .product-check-item { color: #e0e0e0; }
        .export-products-list .product-check-item:hover { background: #f0f0f0; }
        body.dark .export-products-list .product-check-item:hover { background: #3a3a3a; }
        .export-products-list .product-check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #667eea; cursor: pointer; flex-shrink: 0; }
        .export-products-list .product-check-item .info { font-size: 12px; color: #666; }
        body.dark .export-products-list .product-check-item .info { color: #aaa; }

        .stats-modal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 16px 0; }
        .stats-modal-item { background: #f8f9fa; border-radius: 12px; padding: 12px; text-align: center; }
        body.dark .stats-modal-item { background: #1a1a1a; }
        .stats-modal-item .number { font-size: 24px; font-weight: 700; }
        .stats-modal-item .label { font-size: 12px; color: #666; margin-top: 2px; }
        body.dark .stats-modal-item .label { color: #aaa; }
        .stats-modal-item .sub { font-size: 11px; color: #888; margin-top: 2px; }
        body.dark .stats-modal-item .sub { color: #888; }
        .stats-modal-item.red .number { color: #e74c3c; }
        .stats-modal-item.orange .number { color: #e67e22; }
        .stats-modal-item.yellow .number { color: #f39c12; }
        .stats-modal-item.green .number { color: #27ae60; }
        .stats-modal-item.blue .number { color: #3498db; }

        .stats-dept-list { max-height: 180px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }

        body.dark .stats-dept-row { border-bottom-color: #2a2a2a; }
        .stats-dept-row .count { font-weight: 600; }
        .stats-dept-row .status-badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; }

        .stats-dept-row .status-badge.orange { background: #fde8d0; color: #e67e22; }

        .template-item { display: flex; align-items: center; padding: 8px 10px; border-bottom: 1px solid #f0f0f0; gap: 10px; }
        body.dark .template-item { border-bottom: 1px solid #3a3a3a; }

        body.dark .template-item .dept { background: #3a3a3a; color: #aaa; }

<script>
// ============================================
//  КОНФИГУРАЦИЯ - ВАШ URL
// ============================================
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwB9YqxBHLnbfeaHdgaF1KoSXnRAopxScjV_xPEwjDpaEqU1wtdkSh517CRm8Jb-TrZNg/exec';

// ============================================
//  ВСЕ ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ (safeString, parseDateDMY и т.д.)
// ============================================
function safeString(value) {
    if (value === null || value === undefined) return '';
    return String(value).trim();
}

function getTodayDate() {
    const now = new Date();
    return {
        date: now,
        formatted: now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
    };
}

function parseDateDMY(dateStr) {
    if (!dateStr) return null;
    const str = safeString(dateStr);
    const match = str.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (match) {
        return {
            day: parseInt(match[1]),
            month: parseInt(match[2]) - 1,
            year: parseInt(match[3]),
            raw: str
        };
    }
    return null;
}

function getTodayDMY() {
    const now = new Date();
    return {
        day: now.getDate(),
        month: now.getMonth(),
        year: now.getFullYear()
    };
}

function getDaysLeftFromDate(dateStr) {
    if (!dateStr) return 999;
    const expiry = parseDateDMY(dateStr);
    if (!expiry) return 999;
    const today = getTodayDMY();
    const expiryDate = new Date(expiry.year, expiry.month, expiry.day);
    const todayDate = new Date(today.year, today.month, today.day);
    expiryDate.setHours(0, 0, 0, 0);
    todayDate.setHours(0, 0, 0, 0);
    return Math.floor((expiryDate.getTime() - todayDate.getTime()) / (1000 * 60 * 60 * 24));
}

function getDateStr(daysOffset) {
    const d = new Date();
    d.setDate(d.getDate() + daysOffset);
    return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
}

function formatDateForList(dateStr) {
    if (!dateStr) return 'Нет даты';
    const parsed = parseDateDMY(dateStr);
    return parsed ? parsed.raw : dateStr;
}

function normalizeDate(dateStr) {
    if (!dateStr) return getDateStr(7);
    const parsed = parseDateDMY(dateStr);
    return parsed ? parsed.raw : getDateStr(7);
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getStatus(daysLeft) {
    if (daysLeft < 0) return { status: 'Просрочен', class: 'red' };
    if (daysLeft === 0 || daysLeft === 1) return { status: 'Истекает!', class: 'yellow' };
    if (daysLeft >= 2 && daysLeft <= 7) return { status: 'Скоро', class: 'orange' };
    return { status: 'Ок', class: 'green' };
}

function getStatusText(daysLeft) {
    if (daysLeft < 0) return `Просрочен (${Math.abs(daysLeft)} дн.)`;
    if (daysLeft === 0) return 'Истекает СЕГОДНЯ!';
    if (daysLeft === 1) return 'Истекает ЗАВТРА!';
    if (daysLeft >= 2 && daysLeft <= 7) return `${daysLeft} дн.`;
    return `${daysLeft} дн.`;
}

function getProductKey(product) {
    const name = safeString(product.name).toLowerCase();
    const barcode = safeString(product.barcode);
    const expiry = safeString(product.expiry);
    const department = safeString(product.department);
    if (barcode) {
        return `barcode_${barcode}_${expiry}_${department}`;
    }
    return `name_${name}_${expiry}_${department}`;
}

function isEmptyRow(row) {
    return !safeString(row.name) && !safeString(row.barcode) && !safeString(row.weight) && !safeString(row.department) && !safeString(row.expiry);
}

function parseWeight(weightStr) {
    if (!weightStr) return { value: null, unit: null, display: '' };
    let str = safeString(weightStr).toLowerCase().replace(/\s/g, '');
    if (!str) return { value: null, unit: null, display: '' };
    const patterns = [
        { regex: /^([\d.]+)г$/, unit: 'г', type: 'solid' },
        { regex: /^([\d.]+)кг$/, unit: 'кг', type: 'solid' },
        { regex: /^([\d.]+)мл$/, unit: 'мл', type: 'liquid' },
        { regex: /^([\d.]+)л$/, unit: 'л', type: 'liquid' },
    ];
    for (const pattern of patterns) {
        const match = str.match(pattern.regex);
        if (match) {
            const value = parseFloat(match[1]);
            if (!isNaN(value) && value > 0) {
                return { value: value, unit: pattern.unit, type: pattern.type, display: value + pattern.unit };
            }
        }
    }
    return { value: null, unit: null, type: null, display: str };
}

function formatWeightDisplay(weightStr) {
    if (!weightStr) return '';
    const parsed = parseWeight(weightStr);
    return parsed.display || weightStr;
}

function getWeightClass(weightStr) {
    if (!weightStr) return '';
    const parsed = parseWeight(weightStr);
    return parsed.type === 'liquid' ? 'liquid' : parsed.type === 'solid' ? 'solid' : '';
}

function getWeightIcon(weightStr) {
    if (!weightStr) return '';
    const parsed = parseWeight(weightStr);
    return parsed.type === 'liquid' ? '🧪' : parsed.type === 'solid' ? '📦' : '⚖️';
}

// ============================================

// ============================================
let products = [];
let currentFilter = 'all';
let currentSort = 'default';
let currentDepartment = 'all';
let deleteTargetId = null;
let isSyncing = false;
let currentTheme = 'light';
let searchQuery = '';
let selectedProductIds = new Set();
let removeSelectedProductIds = new Set();
let exportSelectedIds = new Set();
let calculatedExpiry = '';
let templates = [];
let editTargetId = null;

//  ТЕМА
// ============================================
function toggleTheme() {
    if (document.body.classList.contains('dark')) {
        document.body.classList.remove('dark');

        currentTheme = 'dark';

// ============================================
function updateSyncStatus(color, text) {
    const dot = document.getElementById('syncDot');
    const textEl = document.getElementById('syncText');
    if (dot) dot.className = 'dot ' + color;
    if (textEl) textEl.textContent = text;

let toastTimeout;
function showToast(text, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.className = 'toast show ' + type;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {

}

// ============================================
//  ЛОКАЛЬНОЕ ХРАНИЛИЩЕ
// ============================================
function isLocalStorageAvailable() {
    try {
        const test = '__test__';
        localStorage.setItem(test, test);
        localStorage.removeItem(test);
        return true;
    } catch(e) {
        return false;
    }
}
const HAS_STORAGE = isLocalStorageAvailable();

function saveToLocal() {

        localStorage.setItem('products_tracker_local', JSON.stringify(products));

}

    }

        if (saved) {

        } else {
            products = [
                { id: '1', name: 'Молоко 3,2% 1л', barcode: '4601234567890', weight: '1л', department: 'Молочка', expiry: getDateStr(2) },
                { id: '2', name: 'Кетчуп Махеев', barcode: '4604258008505', weight: '350г', department: 'Соусы', expiry: getDateStr(5) },
                { id: '3', name: 'Соль', barcode: '4601234567892', weight: '', department: 'Специи', expiry: getDateStr(180) }
            ];
            saveToLocal();
        }
    } catch(e) {
        console.warn('⚠️ Ошибка загрузки:', e);
        products = [];

}

//  ШАБЛОНЫ (упрощенно)
// ============================================
function loadTemplates() {

    if (saved) {

// ============================================
//  НАПОМИНАНИЯ
// ============================================
function checkReminders() {
    let expired = 0;
    let expiring = 0;
    let reminders = [];
    products.forEach(p => {
        const days = getDaysLeftFromDate(p.expiry);
        if (days < 0) {
            expired++;
            reminders.push({ product: p, days: days, type: 'danger', text: `Просрочен на ${Math.abs(days)} дней` });
        } else if (days === 0 || days === 1) {
            expiring++;
            reminders.push({ product: p, days: days, type: 'warning', text: `Истекает ${days === 0 ? 'СЕГОДНЯ!' : 'ЗАВТРА!'}` });
        }
    });
    const badge = document.getElementById('expiredBadge');
    if (expired > 0) {
        badge.textContent = expired;
        badge.style.display = 'inline-block';
    } else {
        badge.style.display = 'none';
    }
    const notifyBadge = document.getElementById('notifyBadge');
    const total = expired + expiring;
    if (total > 0) {
        notifyBadge.textContent = total;
        notifyBadge.style.display = 'inline-block';
    } else {
        notifyBadge.style.display = 'none';
    }
    return reminders;
}

function showReminders() {
    const reminders = checkReminders();
    const container = document.getElementById('remindersList');
    if (reminders.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:30px;"><div style="font-size:48px;">🎉</div><p style="color:#888;margin-top:10px;">Все товары в порядке!<br>Нет критических сроков.</p></div>`;
    } else {
        let html = '';
        reminders.forEach(r => {
            const cls = r.type === 'danger' ? 'danger' : 'warning';
            const daysCls = r.days < 0 ? 'red' : 'orange';
            const daysText = r.days < 0 ? `${Math.abs(r.days)} дн.` : `${r.days} дн.`;
            html += `<div class="reminder-item ${cls}">
                <div class="icon">${r.type === 'danger' ? '🚨' : '⚠️'}</div>
                <div class="text">
                    <div class="title">${escapeHtml(r.product.name)}</div>
                    <div class="sub">📅 ${formatDateForList(r.product.expiry)} ${r.product.department ? '🏪 ' + escapeHtml(r.product.department) : ''}</div>
                    <div class="sub">${r.text}</div>
                </div>
                <div class="days ${daysCls}">${daysText}</div>
            </div>`;
        });
        container.innerHTML = html;
    }
    document.getElementById('remindersModal').classList.add('active');
}

function closeRemindersModal() {
    document.getElementById('remindersModal').classList.remove('active');
}

// ============================================
//  🔥 ИСПРАВЛЕННАЯ СИНХРОНИЗАЦИЯ (С РАЗБИВКОЙ)
// ============================================
async function loadFromGoogle() {
    try {
        updateSyncStatus('yellow', 'Загрузка...');
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        
        const response = await fetch(SHEET_URL, {
            signal: controller.signal,
            headers: { 'Accept': 'application/json' }
        });
        clearTimeout(timeoutId);
        
        if (response.status === 404) {
            updateSyncStatus('red', 'Таблица не найдена');
            loadFromLocal();
            return;
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        if (data && Array.isArray(data) && data.length > 0) {
            const existingMap = new Map();
            products.forEach(p => {
                const key = getProductKey(p);
                existingMap.set(key, p);
            });
            let addedCount = 0;
            data.forEach(row => {
                if (isEmptyRow(row)) return;
                const newProduct = {
                    id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    name: safeString(row.name) || 'Без названия',
                    barcode: safeString(row.barcode),
                    weight: safeString(row.weight),
                    department: safeString(row.department),
                    expiry: normalizeDate(safeString(row.expiry) || getDateStr(7))
                };
                const key = getProductKey(newProduct);
                if (!existingMap.has(key) && newProduct.name && newProduct.name !== 'Без названия') {
                    products.push(newProduct);
                    existingMap.set(key, newProduct);
                    addedCount++;
                }
            });
            if (addedCount > 0) {
                saveToLocal();
                showToast(`✅ Добавлено ${addedCount} товаров из таблицы`);
            }
            render();
            updateSyncStatus('green', `Синхронизировано (${products.length})`);
        } else {
            updateSyncStatus('green', 'Таблица пуста');
            render();
        }
    } catch (error) {
        console.error('Ошибка загрузки:', error);
        if (error.name === 'AbortError') {
            updateSyncStatus('orange', 'Таймаут');
            showToast('⏱️ Таймаут соединения');
        } else {
            updateSyncStatus('red', 'Ошибка загрузки');
            showToast('⚠️ Ошибка синхронизации. Использую локальные данные.');
        }
        loadFromLocal();
    }
}

// 🔥 НОВАЯ ФУНКЦИЯ - РАЗБИВАЕТ ДАННЫЕ НА ЧАСТИ
async function saveToGoogle() {
    try {
        updateSyncStatus('yellow', 'Сохранение...');
        
        // Подготавливаем данные
        const allData = products.map(p => ({
            name: safeString(p.name),
            barcode: safeString(p.barcode),
            weight: safeString(p.weight),
            department: safeString(p.department),
            expiry: safeString(p.expiry)
        }));
        
        if (allData.length === 0) {
            showToast('ℹ️ Нет данных для сохранения');
            return true;
        }
        
        // Разбиваем на части по 50 товаров
        const BATCH_SIZE = 50;
        const batches = [];
        for (let i = 0; i < allData.length; i += BATCH_SIZE) {
            batches.push(allData.slice(i, i + BATCH_SIZE));
        }
        
        let totalSaved = 0;
        let failedBatches = 0;
        
        // Отправляем каждую часть
        for (let i = 0; i < batches.length; i++) {
            const batch = batches[i];
            const batchNum = i + 1;
            
            updateSyncStatus('yellow', `Сохранение (часть ${batchNum}/${batches.length})...`);
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch(SHEET_URL, {
                    method: 'POST',
                    signal: controller.signal,
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(batch)
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text.substring(0, 100)}`);
                }
                
                const result = await response.json();
                if (result.success) {
                    totalSaved += batch.length;
                    showToast(`✅ Часть ${batchNum}/${batches.length} сохранена (${batch.length} товаров)`);
                } else {
                    failedBatches++;
                    console.warn(`Ошибка в части ${batchNum}:`, result.error);
                }
            } catch (batchError) {
                failedBatches++;
                console.error(`Ошибка части ${batchNum}:`, batchError);
                showToast(`⚠️ Ошибка части ${batchNum}, попытка позже...`);
                // Ждем перед повторной попыткой
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            
            // Небольшая задержка между частями
            if (i < batches.length - 1) {
                await new Promise(resolve => setTimeout(resolve, 500));
            }
        }
        
        if (failedBatches === 0) {
            updateSyncStatus('green', `Сохранено (${totalSaved})`);
            showToast(`✅ Сохранено ${totalSaved} товаров`);
            return true;
        } else {
            showToast(`⚠️ Сохранено ${totalSaved} из ${allData.length} (${failedBatches} частей с ошибками)`);
            return false;
        }
    } catch (error) {
        console.error('Ошибка сохранения:', error);
        updateSyncStatus('red', 'Ошибка сохранения');
        showToast('⚠️ Ошибка сохранения: ' + error.message);
        return false;
    }
}

async function syncWithGoogle() {
    if (isSyncing) return;
    isSyncing = true;
    try {
        updateSyncStatus('yellow', 'Синхронизация...');
        showToast('🔄 Синхронизация...');
        await loadFromGoogle();
        await saveToGoogle();
        await loadFromGoogle();
        showToast('✅ Синхронизация завершена!');
        updateSyncStatus('green', `Синхронизировано (${products.length})`);
    } catch (error) {
        console.error('Ошибка синхронизации:', error);
        showToast('⚠️ Ошибка синхронизации');
        updateSyncStatus('red', 'Ошибка');
    }
    isSyncing = false;
}

async function rebuildTable() {
    if (products.length === 0) {
        showToast('📭 Нет товаров для перестройки');
        return;
    }
    if (!confirm('Это перезапишет ВСЕ данные в таблице.\nПродолжить?')) return;
    try {
        showToast('🔄 Перестройка таблицы...');
        await saveToGoogle();
        showToast(`✅ Таблица перестроена (${products.length} товаров)`);
        await loadFromGoogle();
    } catch (error) {
        console.error('Ошибка перестройки:', error);
        showToast('⚠️ Ошибка перестройки таблицы');
    }
}

async function clearAll() {
    if (products.length === 0) {
        showToast('📭 Список пуст');
        return;
    }
    if (!confirm('⚠️ Удалить ВСЕ товары?\nВосстановить данные будет НЕВОЗМОЖНО!')) return;
    products = [];
    saveToLocal();
    render();
    showToast('🗑️ Все товары удалены с сайта');
    try {
        await saveToGoogle();
        showToast('🗑️ Таблица очищена');
    } catch (error) {
        console.error('Ошибка очистки таблицы:', error);
        showToast('⚠️ Ошибка очистки таблицы');
    }
}

// ============================================
//  ОСТАЛЬНЫЕ ФУНКЦИИ (ФИЛЬТРЫ, РЕДАКТОР, КАЛЬКУЛЯТОР, ЭКСПОРТ)
//  - они остаются без изменений из вашего кода
//  - здесь я их пропускаю для краткости
// ============================================

// ============================================
//  ОТРИСОВКА
// ============================================
function render() {
    const today = getTodayDate();
    document.getElementById('todayDate').textContent = '📅 ' + today.formatted;
    
    let filtered = [...products];
    if (searchQuery) {
        filtered = filtered.filter(p => safeString(p.name).toLowerCase().includes(searchQuery.toLowerCase()));
    }
    if (currentFilter === 'expired') {
        filtered = filtered.filter(p => getDaysLeftFromDate(p.expiry) < 0);
    } else if (currentFilter === 'expiring') {
        filtered = filtered.filter(p => {
            const days = getDaysLeftFromDate(p.expiry);
            return days >= 0 && days <= 1;
        });
    } else if (currentFilter === 'week') {
        filtered = filtered.filter(p => {
            const days = getDaysLeftFromDate(p.expiry);
            return days >= 2 && days <= 7;
        });
    } else if (currentFilter === 'ok') {
        filtered = filtered.filter(p => getDaysLeftFromDate(p.expiry) > 7);
    }
    if (currentDepartment !== 'all') {
        filtered = filtered.filter(p => safeString(p.department) === currentDepartment);
    }
    
    if (currentSort === 'name') {
        filtered.sort((a, b) => safeString(a.name).localeCompare(safeString(b.name)));
    } else if (currentSort === 'expiry') {
        filtered.sort((a, b) => safeString(a.expiry).localeCompare(safeString(b.expiry)));
    } else if (currentSort === 'barcode') {
        filtered.sort((a, b) => safeString(a.barcode).localeCompare(safeString(b.barcode)));
    } else if (currentSort === 'department') {
        filtered.sort((a, b) => safeString(a.department).localeCompare(safeString(b.department)));
    } else {
        filtered.sort((a, b) => getDaysLeftFromDate(a.expiry) - getDaysLeftFromDate(b.expiry));
    }
    
    let total = products.length, expired = 0, week = 0, expiring = 0, ok = 0;
    products.forEach(p => {
        const days = getDaysLeftFromDate(p.expiry);
        if (days < 0) expired++;
        else if (days >= 2 && days <= 7) week++;
        else if (days >= 0 && days <= 1) expiring++;
        else ok++;
    });
    
    document.getElementById('totalCount').textContent = total;
    document.getElementById('expiredCount').textContent = expired;
    document.getElementById('weekCount').textContent = week;
    document.getElementById('expiringCount').textContent = expiring;
    document.getElementById('okCount').textContent = ok;
    
    checkReminders();
    
    const list = document.getElementById('productList');
    if (filtered.length === 0) {
        let msg = 'Товаров пока нет';
        let emoji = '📭';
        if (searchQuery) {
            msg = `Товары по запросу "${searchQuery}" не найдены`;
            emoji = '🔍';
        } else if (currentFilter === 'expired') {
            msg = 'Нет просроченных товаров! 🎉';
            emoji = '🎉';
        } else if (currentFilter === 'expiring') {
            msg = 'Нет товаров, истекающих сегодня-завтра! 🎉';
            emoji = '🎉';
        } else if (currentFilter === 'week') {
            msg = 'Нет товаров, истекающих в ближайшую неделю! 👍';
            emoji = '👍';
        } else if (currentFilter === 'ok') {
            msg = 'Нет товаров со сроком > 7 дней';
            emoji = '📦';
        } else if (currentDepartment !== 'all') {
            msg = `Нет товаров в отделе "${currentDepartment}"`;
            emoji = '📦';
        }
        list.innerHTML = `<div class="empty-state"><div class="emoji">${emoji}</div><p>${msg}</p></div>`;
        return;
    }
    
    let html = '';
    filtered.forEach(p => {
        const days = getDaysLeftFromDate(p.expiry);
        const status = getStatus(days);
        const daysText = getStatusText(days);
        const barcodeHtml = p.barcode ? `<span class="product-barcode">🔢 ${escapeHtml(safeString(p.barcode))}</span>` : '';
        let weightHtml = '';
        if (p.weight && safeString(p.weight)) {
            const weightClass = getWeightClass(p.weight);
            const weightIcon = getWeightIcon(p.weight);
            const weightDisplay = formatWeightDisplay(p.weight);
            weightHtml = `<span class="weight-badge ${weightClass}">${weightIcon} ${escapeHtml(weightDisplay)}</span>`;
        }
        const departmentHtml = p.department ? `<span class="department-badge">🏪 ${escapeHtml(safeString(p.department))}</span>` : '';
        const expiryDisplay = formatDateForList(p.expiry);
        const removeDeptBtn = p.department ? 
            `<button class="btn-icon remove-dept" onclick="event.stopPropagation(); removeFromDepartment('${p.id}')" title="Удалить из отдела">🚫</button>` : '';
        html += `
            <div class="product-item" onclick="openEditProductModal('${p.id}')">
                <div class="product-status ${status.class}"></div>
                <div class="product-info">
                    <div class="product-name">${escapeHtml(safeString(p.name))}</div>
                    <div class="product-details">
                        ${barcodeHtml}
                        ${weightHtml}
                        ${departmentHtml}
                        <span class="product-expiry">📅 ${expiryDisplay}</span>
                    </div>
                </div>
                <div class="product-days ${status.class}">${daysText}</div>
                <div class="product-actions" onclick="event.stopPropagation();">
                    ${removeDeptBtn}
                    <button class="btn-icon delete" onclick="openDeleteModal('${p.id}')" title="Удалить товар">✕</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html;
}

// ============================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================
async function init() {
    loadTheme();
    loadTemplates();
    await loadFromGoogle();
    render();
    
    setTimeout(() => {
        const reminders = checkReminders();
        if (reminders.length > 0) {
            const count = reminders.filter(r => r.type === 'danger').length;
            if (count > 0) {
                showToast(`🚨 У вас ${count} просроченных товаров! Нажмите "Напоминания"`, 'danger');
            } else if (reminders.length > 0) {
                showToast(`⚠️ Есть товары с истекающим сроком! Нажмите "Напоминания"`, 'warning');
            }
        }
    }, 1500);
    
    setInterval(() => {
        if (!isSyncing && navigator.onLine !== false) {
            loadFromGoogle();
        }
    }, 60000);
}

// ============================================
//  ЗАПУСК
// ============================================
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
